<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> feedback form</title>
</head>
<body style="background-color: rgb(211, 244, 211);">
    <div style="text-align: center; position: sticky; top: 0; margin: 0; padding: 10px; border-bottom: 3px  solid forestgreen; border-top: 3px solid forestgreen; border-radius: 30px;">
        <h1 style="margin: 4px 0; font-size: clamp(1.4rem, 4vw, 2rem); "> Welcome to XYZ centre </h1>
        <h2 style="margin: 4px 0; font-weight: normal; font-size: clamp(0.9rem, 2.5vw, 1.1rem);"> We are eagerly waiting for your suggestions and feedback </h2>
    </div><br><br>
    
    <div style="padding: 20px 12px; display: flex; justify-content: center;">
      <form action="/submit-feedback" method="POST" style="background: #ffffff; width: 100%; max-width: 550px; padding: 24px; border-radius: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); box-sizing: border-box;">

        <!-- Name Input -->
        <label for="name" style="font-weight: bold; font-size: 1rem; display: block; margin-bottom: 6px;">Enter your name:</label>
        <input type="text" id="name" name="name" required style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; font-size: 1rem; margin-bottom: 16px;">

        <!-- Course Select -->
        <label for="course" style="font-weight: bold; font-size: 1rem; display: block; margin-bottom: 6px;">Select your course:</label>
        <select id="course" name="course" required style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; font-size: 1rem; margin-bottom: 16px; background-color: #fff;">
          <option value="">Select course</option>
          <option value="Course A">Course A</option>
          <option value="Course B">Course B</option>
          <option value="Course C">Course C</option>
        </select>

        <!-- Star Rating -->
        <label for="star-rating" style="font-weight: bold; font-size: 1rem; display: block; margin-bottom: 6px;">Give rating to your course:</label>
        <select id="star-rating" name="Rating" required style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; font-size: 1rem; margin-bottom: 16px; background-color: #fff;">
          <option value="">Select Stars</option>
          <option value="5 stars">★★★★★ (5 Stars)</option>
          <option value="4 stars">★★★★☆ (4 Stars)</option>
          <option value="3 stars">★★★☆☆ (3 Stars)</option>
          <option value="2 stars">★★☆☆☆ (2 Stars)</option>
          <option value="1 star">★☆☆☆☆ (1 Star)</option>
        </select>

        <!-- Feedback Textarea -->
        <label for="comments" style="font-weight: bold; font-size: 1rem; display: block; margin-bottom: 6px;">Your Experience & Suggestions:</label>
        <textarea id="comments" name="comments" rows="5" placeholder="Write your experience and suggestions (if any)..." style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; font-size: 1rem; resize: vertical; margin-bottom: 20px; font-family: inherit;"></textarea>

        <!-- Submit Button -->
        <button type="submit" style="width: 100%; background-color: forestgreen; color: #ffffff; padding: 12px; font-size: 1.05rem; font-weight: bold; border: none; border-radius: 8px; cursor: pointer;">
          Submit Feedback
        </button>

      </form>
    </div>
</body>
</html>
